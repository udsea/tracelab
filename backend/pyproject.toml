[project]
name = "tracelab"
version = "0.1.0"
description = "Local trajectory analysis and intervention workbench for Inspect AI"
requires-python = ">=3.12"
dependencies = [
  "inspect-ai>=0.3.268,<0.4",
  "pydantic>=2.10,<3",
  "duckdb>=1.2,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "platformdirs>=4,<5",
  "openai>=3.1,<4",
  "anthropic>=1.7.0,<2",
  "huggingface-hub>=0.34,<2",
  "fsspec>=2025.3",
  "ijson>=3.3",
]

[project.scripts]
tracelab-backend = "tracelab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]
bundle = ["pyinstaller>=6.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
