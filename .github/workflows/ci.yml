name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      remote_tests:
        description: Run read-only tests against the pinned public Hugging Face corpus
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UV_FROZEN: 'true'
  PYTHON_VERSION: '3.13'

jobs:
  checks:
    name: Source, frontend, and backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.10.2'
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project backend --frozen
      - name: Repository policy and whitespace
        run: |
          python3 scripts/check_repository.py
          git diff --check
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Python lint and format
        run: |
          uv run --project backend ruff check backend tests scripts
          uv run --project backend ruff format --check backend tests scripts
      - name: Backend tests (no model or corpus API calls)
        run: uv run --project backend pytest tests -q
      - name: Frontend tests and production build
        run: |
          pnpm test
          pnpm build
      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code

  macos:
    name: macOS ARM64 bundle
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.10.2'
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, explicit toolchain
        with:
          toolchain: '1.94.0'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project backend --frozen --group bundle
      - name: Validate Rust and native test behavior
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          uv run --project backend pytest tests -q
      - name: Build self-contained application
        run: |
          pnpm sidecar:build
          pnpm exec tauri build --config src-tauri/tauri.bundle.conf.json --bundles app --no-sign -- --locked
      - name: Smoke-test the packaged runtime
        run: uv run --project backend python scripts/smoke_bundle.py
      - name: Archive with executable permissions and checksums
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/TraceLab.app artifacts/TraceLab-macos-arm64.zip
          shasum -a 256 artifacts/TraceLab-macos-arm64.zip > artifacts/SHA256SUMS
          printf 'commit=%s\nrunner=%s\narch=%s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" > artifacts/BUILD.txt
          rustc --version >> artifacts/BUILD.txt
          uv --version >> artifacts/BUILD.txt
          node --version >> artifacts/BUILD.txt
          pnpm --version >> artifacts/BUILD.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: TraceLab-macos-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  remote-corpus:
    name: Optional public corpus acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.remote_tests
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.10.2'
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --project backend --frozen
      - name: Read pinned public files (no model calls)
        env:
          TRACELAB_REMOTE_TESTS: '1'
        run: uv run --project backend pytest tests/test_remote_corpus.py -q -s
